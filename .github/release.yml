changelog:
  exclude:
    labels:
      - ignore-for-release
      - documentation
    authors:
      - "dependabot[bot]"
      - "renovate[bot]"
  categories:
    - title: ⚡️ Breaking Changes
      labels:
        - breaking
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🔨 Maintenance
      labels:
        - maintenance
        - refactor
    - title: Misc
      labels:
        - "*"
