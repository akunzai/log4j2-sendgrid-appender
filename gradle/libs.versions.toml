[versions]
spotbugs = "6.5.11"
sendgrid = "4.10.3"
jakartaMail = "2.1.5"
log4j = "2.26.1"
junit = "6.1.3"
disruptor = "4.0.0"
spotbugsPlugin = "4.10.4"
findsecbugs = "1.14.0"
jackson = "2.22.2"
commonsCodec = "1.22.1"
jreleaser = "1.25.0"

[libraries]
sendgrid-java = { module = "com.sendgrid:sendgrid-java", version.ref = "sendgrid" }
jakarta-mail-api = { module = "jakarta.mail:jakarta.mail-api", version.ref = "jakartaMail" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }
log4j-jakarta-smtp = { module = "org.apache.logging.log4j:log4j-jakarta-smtp", version.ref = "log4j" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version = "2.0.5" }
spotbugs-plugin = { module = "com.github.spotbugs:spotbugs", version.ref = "spotbugsPlugin" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
